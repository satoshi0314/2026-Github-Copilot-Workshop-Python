<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <style>
        body {
            background: #7b6eea;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #f8f8fc;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(123, 110, 234, 0.2);
            padding: 40px 32px;
            width: 340px;
            text-align: center;
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            margin: 32px 0 24px 0;
        }
        .btn {
            background: #7b6eea;
            color: #fff;
            border: none;
            border-radius: 24px;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
        }
        .btn:active {
            background: #5a4fcf;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">ポモドーロタイマー</div>
        <div class="timer" id="timer">25:00</div>
        <button class="btn" disabled>開始</button>
    </div>
</body>
</html>
